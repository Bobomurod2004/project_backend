# Backend uchun nginx namunasi.
# Django (8001) va AI Agent (8002) konteynerlari oldida.
#
# MUHIM:
#  - /api/  : proxy_pass OXIRIDA "/" YO'Q  -> /api/ saqlanadi (Django /api/ kutadi)
#  - /agent/: proxy_pass OXIRIDA "/ai/"    -> /agent/X -> /ai/X (agent /ai/ kutadi)

server {
    listen 80;
    server_name 178.128.100.231;   # domeningiz yoki IP

    client_max_body_size 20m;

    # ── Django API ──
    # Diqqat: oxirida "/" YO'Q — to'liq /api/... yo'li Django'ga uzatiladi
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Django admin ──
    location /admin/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Django statik (admin/DRF css) ──
    location /static/ {
        proxy_pass http://127.0.0.1:8001;
    }

    # ── AI Agent ──
    # /agent/X  ->  /ai/X  (oxiridagi "/ai/" shu ishni qiladi)
    location /agent/ {
        proxy_pass http://127.0.0.1:8002/ai/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM javoblari sekin bo'lishi mumkin — timeout oshiramiz
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
